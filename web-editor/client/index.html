<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>KOTOR mod editor</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #141821;
    --panel-2: #1b212d;
    --border: #2a3142;
    --text: #e6e8ee;
    --muted: #8a93a6;
    --accent: #f5c563;
    --accent-2: #6ec1e4;
    --danger: #e07a7a;
    --ok: #7ad48a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", Segoe UI, Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: 0.3px; }
  header h1 span { color: var(--accent); }
  header .spacer { flex: 1; }
  select, button, input[type=text] {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 5px 8px; font: inherit;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #1a1408; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .layout { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 45px); }
  aside { background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; }
  aside .group { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  aside .group-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  aside ul { list-style: none; padding: 0; margin: 0; }
  aside li { padding: 4px 8px; border-radius: 3px; cursor: pointer; font-family: ui-monospace, Menlo, monospace; font-size: 12px;
    display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  aside li .file-label { min-width: 0; flex: 1; overflow: hidden; }
  aside li .file-display-name { font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px; color: var(--text); text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
  aside li .file-sub { font-size: 10px; color: var(--muted); text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
  aside li.active .file-display-name { color: #1a1408; }
  aside li.active .file-sub { color: #4a3b1a; }
  aside li:hover { background: var(--panel-2); }
  aside li.active { background: var(--accent); color: #1a1408; font-weight: 600; }
  aside li .ext { color: var(--muted); font-size: 10px; }
  aside li.active .ext { color: #4a3b1a; }
  aside li .extract { font-size: 10px; padding: 2px 6px; border-radius: 3px;
    background: var(--accent-2); color: #0b1419; border: 0; }
  aside .tabs { display: flex; gap: 4px; padding: 6px 8px; background: var(--panel);
    border-bottom: 1px solid var(--border); }
  aside .tab { flex: 1; padding: 5px; text-align: center; border-radius: 3px;
    cursor: pointer; font-size: 12px; color: var(--muted); }
  aside .tab.active { background: var(--panel-2); color: var(--accent); }
  main { display: flex; flex-direction: column; overflow: hidden; }
  .toolbar { display: flex; gap: 8px; align-items: center; padding: 8px 12px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .toolbar .filename { font-family: ui-monospace, Menlo, monospace; color: var(--accent-2); }
  .toolbar .info { color: var(--muted); font-size: 12px; }
  .toolbar .spacer { flex: 1; }
  .toolbar .schema-desc { color: var(--muted); font-size: 12px; font-style: italic; max-width: 50%; }
  .status { font-size: 12px; color: var(--muted); }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--danger); }
  .grid-wrap { flex: 1; overflow: auto; }
  table { border-collapse: collapse; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  th, td { border: 1px solid var(--border); padding: 0; min-width: 80px; }
  th { background: var(--panel); position: sticky; top: 0; z-index: 2;
    padding: 6px 8px; color: var(--accent); text-align: left; white-space: nowrap; cursor: help; }
  th[title]::after { content: " ⓘ"; color: var(--accent-2); font-size: 10px; opacity: 0.7; }
  th.rowlabel, td.rowlabel { position: sticky; left: 0; background: var(--panel);
    color: var(--muted); z-index: 1; }
  th.rowlabel { z-index: 3; }
  td input { width: 100%; background: transparent; color: var(--text); border: 0;
    padding: 5px 7px; font: inherit; outline: none; }
  td input:focus { background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--accent); }
  td.dirty input { color: var(--accent); }
  .empty { padding: 40px; color: var(--muted); text-align: center; }
  .filter { padding: 4px 8px; width: 100%; }

  /* GFF tree editor */
  .gff-tree { padding: 12px 18px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .gff-node { margin: 2px 0; }
  .gff-key { color: var(--accent-2); }
  .gff-type { color: var(--muted); font-size: 10px; margin-left: 6px; }
  .gff-leaf { display: flex; gap: 8px; align-items: center; padding: 2px 0; }
  .gff-leaf input { flex: 1; min-width: 0; max-width: 360px; background: var(--panel-2);
    color: var(--text); border: 1px solid var(--border); border-radius: 3px;
    padding: 3px 6px; font: inherit; }
  .gff-leaf input:focus { border-color: var(--accent); outline: none; }
  .gff-leaf.dirty input { color: var(--accent); border-color: var(--accent); }
  .gff-children { margin-left: 16px; border-left: 1px dashed var(--border); padding-left: 10px; }
  details > summary { cursor: pointer; user-select: none; padding: 2px 0; }
  details > summary:hover { color: var(--accent); }

  /* Quick-edit form */
  .qe { padding: 16px 22px; }
  .qe h2 { font-size: 13px; margin: 18px 0 8px;
    text-transform: uppercase; letter-spacing: 0.8px; color: var(--accent); }
  .qe h2:first-child { margin-top: 0; }
  .qe .display-name { font-size: 18px; font-weight: 600; color: var(--text);
    margin-bottom: 4px; }
  .qe .file-id { font-family: ui-monospace, Menlo, monospace; color: var(--muted);
    font-size: 12px; margin-bottom: 18px; }
  .qe-grid { display: grid; grid-template-columns: 200px 1fr; gap: 6px 12px;
    margin-bottom: 8px; }
  .qe-grid .lbl { color: var(--muted); padding-top: 5px; font-size: 12px; }
  .qe-grid .lbl[title] { cursor: help; border-bottom: 1px dotted var(--muted); }
  .qe-grid .ctl { display: flex; flex-direction: column; gap: 2px; }
  .qe-grid input, .qe-grid select { width: 100%; max-width: 360px;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 3px; padding: 4px 7px; font: inherit; }
  .qe-grid input:focus, .qe-grid select:focus { border-color: var(--accent); outline: none; }
  .qe-grid .ctl.dirty input, .qe-grid .ctl.dirty select { border-color: var(--accent); color: var(--accent); }
  .qe-grid .strref { color: var(--accent-2); font-size: 11px; }
  .qe-grid .help { color: var(--muted); font-size: 11px; font-style: italic; }
  .qe-grid input[type=checkbox] { width: auto; }
  .advanced-toggle { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }

  /* Category groups in sidebar */
  aside .cat-header { padding: 6px 8px 3px; color: var(--muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.6px; }
</style>
</head>
<body>
<header>
  <h1>KOTOR <span>mod</span> editor</h1>
  <select id="install"></select>
  <span class="status" id="installStatus"></span>
  <span class="spacer"></span>
  <span class="status" id="saveStatus"></span>
  <button id="reloadBtn">Reload</button>
  <button id="saveBtn" class="primary" disabled>Save</button>
</header>

<div class="layout">
  <aside>
    <div class="tabs">
      <div class="tab active" data-source="override">Override</div>
      <div class="tab" data-source="vanilla">Vanilla</div>
      <div class="tab" data-source="saves">Saves</div>
    </div>
    <div class="group" id="kindGroup" style="display:none">
      <div class="group-title">Resource type</div>
      <select id="kind">
        <option value="2da">.2da — data tables</option>
        <option value="uti">.uti — items</option>
        <option value="utc">.utc — creatures</option>
      </select>
    </div>
    <div class="group">
      <div class="group-title">
        <span id="listTitle">Files in Override</span>
        <span id="listCount" style="color:var(--muted)"></span>
      </div>
      <div id="archiveBack" style="display:none; padding: 4px 0;">
        <button id="archiveBackBtn" style="width:100%">← back to saves</button>
      </div>
      <input type="text" id="fileFilter" class="filter" placeholder="filter…" />
    </div>
    <ul id="fileList"></ul>
  </aside>
  <main>
    <div class="toolbar">
      <span class="filename" id="currentFile">— select a file —</span>
      <span class="info" id="currentInfo"></span>
      <span class="spacer"></span>
      <input type="text" id="rowFilter" placeholder="filter rows…" />
    </div>
    <div class="toolbar" id="schemaBar" style="display:none">
      <span class="schema-desc" id="schemaDesc"></span>
    </div>
    <div class="grid-wrap" id="gridWrap">
      <div class="empty">Pick a file from the sidebar to start editing.</div>
    </div>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const state = {
  installs: [],
  install: null,
  source: "override",        // "override" | "vanilla"
  kind: "2da",
  files: [],
  current: null,             // { name, kind, ... }
  dirty: new Set(),
  schema: {},
};

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    const t = await r.text();
    throw new Error(`${r.status}: ${t}`);
  }
  return r.json();
}

async function loadInstalls() {
  state.installs = await api("/api/installs");
  const sel = $("install");
  sel.innerHTML = "";
  for (const i of state.installs) {
    const opt = document.createElement("option");
    opt.value = i.key;
    opt.textContent = i.label + (i.exists ? "" : " (not found)");
    sel.appendChild(opt);
  }
  state.install = sel.value;
  updateInstallStatus();
  await loadList();
}

function updateInstallStatus() {
  const i = state.installs.find(x => x.key === state.install);
  if (!i) { $("installStatus").textContent = ""; return; }
  const bits = [];
  bits.push(`Override: ${i.exists ? "✓" : "missing"}`);
  bits.push(`chitin.key: ${i.data_exists ? "✓" : "missing"}`);
  $("installStatus").textContent = bits.join("  ·  ") + "  ·  " + i.override;
  $("installStatus").className =
    "status" + (i.exists || i.data_exists ? " ok" : " err");
}

async function loadList() {
  $("listCount").textContent = "loading…";
  if (state.source === "override") {
    $("listTitle").textContent = "Files in Override";
    $("kindGroup").style.display = "none";
    const data = await api(`/api/files?install=${state.install}`);
    state.files = data.files.map(f => ({ ...f, source: "override" }));
  } else if (state.source === "vanilla") {
    $("listTitle").textContent = "Vanilla (in BIF)";
    $("kindGroup").style.display = "";
    try {
      const data = await api(`/api/vanilla?install=${state.install}&kind=${state.kind}`);
      state.files = data.files.map(f => ({ ...f, source: "vanilla" }));
    } catch (e) {
      state.files = [];
      $("listCount").textContent = "(chitin.key not found)";
      return;
    }
  } else if (state.source === "saves") {
    $("listTitle").textContent = "Save games";
    $("kindGroup").style.display = "none";
    try {
      // Two-level: saves at top, files inside each save when expanded
      const data = await api(`/api/saves?install=${state.install}`);
      const expanded = state.expandedSave;
      state.files = [];
      for (const s of data.saves) {
        state.files.push({
          name: s.folder,
          display_name: s.display_name,
          source: "saves",
          folder: s.folder,
          isFolder: true,
          category: "Saves",
        });
        if (expanded === s.folder) {
          const inner = await api(
            `/api/save_files?install=${state.install}&folder=${encodeURIComponent(s.folder)}`
          );
          for (const f of inner.files) {
            state.files.push({
              name: `   ${f.name}`,
              display_name: f.label,
              source: "saves",
              folder: s.folder,
              fileName: f.name,
              kind: f.kind,
              category: "Saves",
            });
          }
        }
      }
    } catch (e) {
      state.files = [];
      $("listCount").textContent = "(no saves found)";
      return;
    }
  } else if (state.source === "archive") {
    // Browsing inside a .sav (ERF) archive, possibly nested
    const innerList = state.archive.inner || [];
    const trail = [state.archive.name, ...innerList].join(" → ");
    $("listTitle").textContent = `In ${trail}`;
    $("kindGroup").style.display = "none";
    try {
      const innerParam = innerList.join("|");
      const data = await api(
        `/api/save_archive?install=${state.install}` +
        `&folder=${encodeURIComponent(state.archive.folder)}` +
        `&name=${encodeURIComponent(state.archive.name)}` +
        `&inner=${encodeURIComponent(innerParam)}`
      );
      state.files = data.entries.map(e => ({
        name: e.filename,
        display_name: e.display_name || (e.is_archive ? "archive" : (e.is_gff ? e.extension.toUpperCase() : null)),
        source: "archive",
        folder: state.archive.folder,
        archive: state.archive.name,
        inner: innerList,
        resref: e.resref,
        res_type: e.res_type,
        is_gff: e.is_gff,
        is_archive: e.is_archive,
        category: e.is_archive ? "Nested archives" : e.extension.toUpperCase(),
      }));
    } catch (e) {
      state.files = [];
      $("listCount").textContent = "(failed: " + e.message + ")";
      return;
    }
  }
  $("listCount").textContent = `${state.files.length}`;
  $("archiveBack").style.display = state.source === "archive" ? "" : "none";
  renderFileList();
}

function renderFileList() {
  const q = $("fileFilter").value.toLowerCase();
  const ul = $("fileList");
  ul.innerHTML = "";
  const items = state.files.filter(f => !q || f.name.toLowerCase().includes(q));
  if (items.length === 0) {
    const li = document.createElement("li");
    li.textContent = "(none)";
    li.style.color = "var(--muted)";
    li.style.cursor = "default";
    ul.appendChild(li);
    return;
  }
  // Group by category
  const groups = new Map();
  for (const f of items) {
    const cat = f.category || "Other";
    if (!groups.has(cat)) groups.set(cat, []);
    groups.get(cat).push(f);
  }
  // Cap total rendered (vanilla can be huge)
  let budget = 600;
  for (const [cat, arr] of groups) {
    if (budget <= 0) break;
    const header = document.createElement("li");
    header.className = "cat-header";
    header.textContent = `${cat} (${arr.length})`;
    header.style.cursor = "default";
    ul.appendChild(header);
    const slice = arr.slice(0, budget);
    budget -= slice.length;
    for (const f of slice) {
      const li = document.createElement("li");
      li.classList.add("file-item");
      const left = document.createElement("span");
      left.className = "file-label";
      if (f.display_name) {
        const top = document.createElement("div");
        top.className = "file-display-name";
        top.textContent = f.display_name;
        const sub = document.createElement("div");
        sub.className = "file-sub";
        sub.textContent = f.name;
        left.appendChild(top);
        left.appendChild(sub);
      } else {
        left.textContent = f.name;
      }
      li.appendChild(left);
      if (f.source === "vanilla") {
        const btn = document.createElement("button");
        btn.className = "extract";
        btn.textContent = "extract";
        btn.onclick = (e) => { e.stopPropagation(); extractVanilla(f.name); };
        li.appendChild(btn);
        li.onclick = () => extractVanilla(f.name);
      } else if (f.source === "saves") {
        if (f.isFolder) {
          if (state.expandedSave === f.folder) li.style.fontWeight = "600";
          li.onclick = () => {
            state.expandedSave = state.expandedSave === f.folder ? null : f.folder;
            loadList();
          };
        } else if (f.fileName && f.fileName.toLowerCase().endsWith(".sav")) {
          li.onclick = () => {
            state.source = "archive";
            state.archive = { folder: f.folder, name: f.fileName };
            loadList();
          };
        } else {
          if (state.current && state.current._saveKey === f.folder + "/" + f.fileName) {
            li.classList.add("active");
          }
          li.onclick = () => openSaveFile(f.folder, f.fileName);
        }
      } else if (f.source === "archive") {
        if (f.is_archive) {
          li.style.fontWeight = "600";
          li.title = "Nested archive — click to descend";
          li.onclick = () => {
            state.archive = {
              folder: f.folder,
              name: f.archive,
              inner: [...(f.inner || []), f.name],
            };
            loadList();
          };
        } else if (!f.is_gff) {
          li.style.color = "var(--muted)";
          li.title = "Non-GFF resource — read-only in this editor";
        } else {
          const key = f.archive + "/" + (f.inner || []).join("|") + "/" + f.resref + "." + f.res_type;
          if (state.current && state.current._archiveKey === key) {
            li.classList.add("active");
          }
          li.onclick = () => openArchiveEntry(f);
        }
      } else {
        if (state.current && state.current.name === f.name) li.classList.add("active");
        li.onclick = () => openFile(f.name);
      }
      ul.appendChild(li);
    }
    if (arr.length > slice.length) {
      const li = document.createElement("li");
      li.textContent = `  …${arr.length - slice.length} more`;
      li.style.color = "var(--muted)";
      li.style.cursor = "default";
      ul.appendChild(li);
    }
  }
}

async function extractVanilla(name) {
  try {
    await api(
      `/api/extract?install=${state.install}&kind=${state.kind}&name=${encodeURIComponent(name)}`,
      { method: "POST" }
    );
    $("saveStatus").textContent = `extracted ${name} → Override`;
    $("saveStatus").className = "status ok";
    // Flip to Override and open the freshly extracted file
    state.source = "override";
    for (const t of document.querySelectorAll(".tab")) {
      t.classList.toggle("active", t.dataset.source === "override");
    }
    await loadList();
    openFile(name);
  } catch (e) {
    $("saveStatus").textContent = "extract failed: " + e.message;
    $("saveStatus").className = "status err";
  }
}

async function openSaveFile(folder, fileName) {
  if (state.dirty.size > 0) {
    if (!confirm("Unsaved changes will be lost. Continue?")) return;
  }
  const data = await api(
    `/api/save_file?install=${state.install}` +
    `&folder=${encodeURIComponent(folder)}&name=${encodeURIComponent(fileName)}`
  );
  state.current = {
    name: fileName,
    _saveKey: folder + "/" + fileName,
    _saveFolder: folder,
    _saveFile: fileName,
    ...data,
  };
  await _renderOpenedGFF(`${folder}/${fileName}`, data);
}

async function openArchiveEntry(f) {
  if (state.dirty.size > 0) {
    if (!confirm("Unsaved changes will be lost. Continue?")) return;
  }
  const innerParam = (f.inner || []).join("|");
  const data = await api(
    `/api/save_archive_entry?install=${state.install}` +
    `&folder=${encodeURIComponent(f.folder)}` +
    `&archive=${encodeURIComponent(f.archive)}` +
    `&inner=${encodeURIComponent(innerParam)}` +
    `&resref=${encodeURIComponent(f.resref)}` +
    `&res_type=${f.res_type}`
  );
  const trail = [f.archive, ...(f.inner || [])].join(" → ");
  state.current = {
    name: f.resref + "." + data.extension,
    _archiveKey: f.archive + "/" + (f.inner || []).join("|") + "/" + f.resref + "." + f.res_type,
    _archiveFolder: f.folder,
    _archiveName: f.archive,
    _archiveInner: f.inner || [],
    _archiveResref: f.resref,
    _archiveResType: f.res_type,
    ...data,
  };
  await _renderOpenedGFF(`${trail} → ${state.current.name}`, data);
}

async function _renderOpenedGFF(label, data) {
  state.dirty = new Set();
  $("saveBtn").disabled = true;
  $("saveStatus").textContent = "";
  $("currentFile").textContent = data.display_name || state.current.name;
  $("currentInfo").textContent = `${data.doc._type.trim()}  ·  ${label}`;
  $("schemaBar").style.display = "none";
  if (!state.gffSchemaCache) state.gffSchemaCache = {};
  if (!state.gffSchemaCache[data.gff_kind]) {
    state.gffSchemaCache[data.gff_kind] = await api(`/api/gff_schema?kind=${data.gff_kind}`);
  }
  state.gffSchema = state.gffSchemaCache[data.gff_kind];
  renderFileList();
  renderGFF();
}

async function openFile(name) {
  if (state.dirty.size > 0) {
    if (!confirm("Unsaved changes will be lost. Continue?")) return;
  }
  const data = await api(`/api/file?install=${state.install}&name=${encodeURIComponent(name)}`);
  state.current = { name, ...data };
  state.dirty = new Set();
  $("saveBtn").disabled = true;
  $("saveStatus").textContent = "";
  $("currentFile").textContent = name;
  renderFileList();

  if (data.kind === "2da") {
    $("currentInfo").textContent =
      `${data.version} · ${data.rows.length} rows × ${data.columns.length} cols`;
    state.schema = await api(`/api/schema?name=${encodeURIComponent(name)}`);
    const desc = state.schema._description;
    if (desc) {
      $("schemaBar").style.display = "";
      $("schemaDesc").textContent = desc;
    } else {
      $("schemaBar").style.display = "none";
    }
    renderTwoDA();
  } else {
    const dn = data.display_name;
    $("currentFile").textContent = dn ? `${dn}` : name;
    $("currentInfo").textContent =
      `${data.doc._type.trim()}` + (dn ? `  ·  ${name}` : "");
    $("schemaBar").style.display = "none";
    // Lazy-load the GFF schema for this kind
    if (!state.gffSchemaCache) state.gffSchemaCache = {};
    if (!state.gffSchemaCache[data.gff_kind]) {
      state.gffSchemaCache[data.gff_kind] = await api(
        `/api/gff_schema?kind=${data.gff_kind}`
      );
    }
    state.gffSchema = state.gffSchemaCache[data.gff_kind];
    renderGFF();
  }
}

function renderTwoDA() {
  const wrap = $("gridWrap");
  const { columns, row_labels, rows } = state.current;
  const q = $("rowFilter").value.toLowerCase();

  const table = document.createElement("table");
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  const corner = document.createElement("th");
  corner.className = "rowlabel";
  corner.textContent = "row";
  trh.appendChild(corner);
  for (const c of columns) {
    const th = document.createElement("th");
    th.textContent = c;
    const desc = state.schema && state.schema[c];
    if (desc) th.title = desc;
    trh.appendChild(th);
  }
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  for (let r = 0; r < rows.length; r++) {
    if (q) {
      const hay = (row_labels[r] + " " + rows[r].join(" ")).toLowerCase();
      if (!hay.includes(q)) continue;
    }
    const tr = document.createElement("tr");
    const lab = document.createElement("td");
    lab.className = "rowlabel";
    lab.textContent = row_labels[r];
    tr.appendChild(lab);
    for (let c = 0; c < columns.length; c++) {
      const td = document.createElement("td");
      const inp = document.createElement("input");
      inp.value = rows[r][c];
      inp.dataset.r = r;
      inp.dataset.c = c;
      const key = r + "," + c;
      if (state.dirty.has(key)) td.classList.add("dirty");
      inp.addEventListener("input", onCellInput);
      td.appendChild(inp);
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrap.innerHTML = "";
  wrap.appendChild(table);
}

function onCellInput(e) {
  const inp = e.target;
  const r = +inp.dataset.r, c = +inp.dataset.c;
  state.current.rows[r][c] = inp.value;
  state.dirty.add(r + "," + c);
  inp.parentElement.classList.add("dirty");
  $("saveBtn").disabled = false;
  $("saveStatus").textContent = `${state.dirty.size} unsaved cell(s)`;
  $("saveStatus").className = "status";
}

// ---------------- GFF tree editor ----------------

const SIMPLE_TYPES = {
  0: "byte", 1: "char", 2: "word", 3: "short",
  4: "dword", 5: "int", 6: "dword64", 7: "int64",
  8: "float", 9: "double", 10: "string", 11: "resref",
};
const STRUCT_TYPE = 14, LIST_TYPE = 15, LOCSTR_TYPE = 12, VOID_TYPE = 13;

function renderGFF() {
  const wrap = $("gridWrap");
  wrap.innerHTML = "";

  const qe = document.createElement("div");
  qe.className = "qe";

  const sch = state.gffSchema && state.gffSchema.schema;
  const enums = (state.gffSchema && state.gffSchema.enums) || {};
  const root = state.current.doc._struct;

  // Display name + filename header
  if (state.current.display_name) {
    const dn = document.createElement("div");
    dn.className = "display-name";
    dn.textContent = state.current.display_name;
    qe.appendChild(dn);
  }
  const fid = document.createElement("div");
  fid.className = "file-id";
  fid.textContent = state.current.name;
  qe.appendChild(fid);

  if (sch && sch.sections) {
    for (const section of sch.sections) {
      const h = document.createElement("h2");
      h.textContent = section.title;
      qe.appendChild(h);
      const grid = document.createElement("div");
      grid.className = "qe-grid";
      for (const f of section.fields) {
        const entry = root[f.name];
        if (!entry) continue;  // field not present in this file
        // Label
        const lbl = document.createElement("div");
        lbl.className = "lbl";
        lbl.textContent = f.label;
        if (f.help) lbl.title = f.help;
        grid.appendChild(lbl);
        // Control
        const ctl = document.createElement("div");
        ctl.className = "ctl";
        const ftype = entry.type;

        if (f.kind === "list") {
          const span = document.createElement("span");
          span.className = "help";
          span.textContent = `${entry.value.length} entries — see Advanced tree below`;
          ctl.appendChild(span);
        } else if (f.kind === "locstring") {
          const subs = entry.value.substrings;
          const inp = document.createElement("input");
          inp.value = (subs && subs[0]) ? subs[0].text : "";
          inp.placeholder = "(no inline text — uses dialog.tlk)";
          inp.dataset.path = f.name;
          inp.dataset.kind = "locstring";
          inp.addEventListener("input", onGffEdit);
          inp.addEventListener("input", () => ctl.classList.add("dirty"));
          ctl.appendChild(inp);
          const strref = entry.value.strref;
          if (strref !== undefined && strref !== 0xFFFFFFFF) {
            const sr = document.createElement("span");
            sr.className = "strref";
            sr.textContent = `StrRef ${strref}`;
            sr.dataset.strref = strref;
            ctl.appendChild(sr);
            resolveStrRef(strref, sr);
          }
        } else if (f.kind === "bool") {
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = !!entry.value;
          cb.dataset.path = f.name;
          cb.dataset.kind = "scalar";
          cb.dataset.ftype = String(ftype);
          cb.addEventListener("change", (e) => {
            entry.value = e.target.checked ? 1 : 0;
            state.dirty.add(f.name);
            ctl.classList.add("dirty");
            $("saveBtn").disabled = false;
            $("saveStatus").textContent = `${state.dirty.size} unsaved field(s)`;
          });
          ctl.appendChild(cb);
        } else if (f.kind === "enum") {
          const opts = enums[f.enum] || {};
          const sel = document.createElement("select");
          // Always include the actual current value, even if unknown
          const keys = new Set(Object.keys(opts));
          keys.add(String(entry.value));
          const sortedKeys = [...keys].sort((a, b) => +a - +b);
          for (const k of sortedKeys) {
            const o = document.createElement("option");
            o.value = k;
            o.textContent = opts[k] ? `${k} — ${opts[k]}` : `${k} (unknown)`;
            if (+k === +entry.value) o.selected = true;
            sel.appendChild(o);
          }
          sel.dataset.path = f.name;
          sel.dataset.kind = "scalar";
          sel.dataset.ftype = String(ftype);
          sel.addEventListener("change", onGffEdit);
          sel.addEventListener("change", () => ctl.classList.add("dirty"));
          ctl.appendChild(sel);
        } else {
          const inp = document.createElement("input");
          inp.value = String(entry.value);
          if (f.min !== undefined || f.max !== undefined) {
            inp.type = "number";
            if (f.min !== undefined) inp.min = f.min;
            if (f.max !== undefined) inp.max = f.max;
          }
          inp.dataset.path = f.name;
          inp.dataset.kind = "scalar";
          inp.dataset.ftype = String(ftype);
          inp.addEventListener("input", onGffEdit);
          inp.addEventListener("input", () => ctl.classList.add("dirty"));
          ctl.appendChild(inp);
        }

        if (f.help && f.kind !== "list") {
          const help = document.createElement("span");
          help.className = "help";
          help.textContent = f.help;
          ctl.appendChild(help);
        }
        grid.appendChild(ctl);
      }
      qe.appendChild(grid);
    }
  }

  // Advanced: full GFF tree
  const adv = document.createElement("details");
  adv.className = "advanced-toggle";
  const sum = document.createElement("summary");
  sum.innerHTML = `<strong>Advanced</strong>  <span style="color:var(--muted)">— full GFF tree (lists, nested structs, every field)</span>`;
  adv.appendChild(sum);
  const tree = document.createElement("div");
  tree.className = "gff-tree";
  tree.appendChild(renderStruct(state.current.doc._struct, "", false));
  adv.appendChild(tree);
  qe.appendChild(adv);

  wrap.appendChild(qe);
}

async function resolveStrRef(strref, el) {
  try {
    const r = await api(`/api/strref?install=${state.install}&strref=${strref}`);
    if (r.text) el.textContent = `StrRef ${strref}: "${r.text}"`;
  } catch (e) { /* silent */ }
}

function renderStruct(node, pathPrefix, openByDefault) {
  const wrap = document.createElement("div");
  const entries = Object.entries(node).filter(([k]) => !k.startsWith("_"));
  for (const [label, field] of entries) {
    const path = pathPrefix ? pathPrefix + "." + label : label;
    const t = field.type;
    if (t === STRUCT_TYPE) {
      const det = document.createElement("details");
      if (openByDefault) det.open = true;
      const sum = document.createElement("summary");
      sum.innerHTML = `<span class="gff-key">${label}</span><span class="gff-type">struct</span>`;
      det.appendChild(sum);
      const children = document.createElement("div");
      children.className = "gff-children";
      children.appendChild(renderStruct(field.value, path, false));
      det.appendChild(children);
      wrap.appendChild(det);
    } else if (t === LIST_TYPE) {
      const det = document.createElement("details");
      const sum = document.createElement("summary");
      sum.innerHTML = `<span class="gff-key">${label}</span><span class="gff-type">list[${field.value.length}]</span>`;
      det.appendChild(sum);
      const children = document.createElement("div");
      children.className = "gff-children";
      field.value.forEach((item, i) => {
        const itemDet = document.createElement("details");
        const itemSum = document.createElement("summary");
        itemSum.innerHTML = `<span class="gff-key">[${i}]</span><span class="gff-type">struct</span>`;
        itemDet.appendChild(itemSum);
        const sub = document.createElement("div");
        sub.className = "gff-children";
        sub.appendChild(renderStruct(item, path + "[" + i + "]", false));
        itemDet.appendChild(sub);
        children.appendChild(itemDet);
      });
      det.appendChild(children);
      wrap.appendChild(det);
    } else if (t === LOCSTR_TYPE) {
      const row = document.createElement("div");
      row.className = "gff-leaf";
      const key = document.createElement("span");
      key.className = "gff-key";
      key.textContent = label;
      const ty = document.createElement("span");
      ty.className = "gff-type";
      ty.textContent = "locstring";
      const sub = field.value.substrings[0];
      const text = sub ? sub.text : "";
      const inp = document.createElement("input");
      inp.value = text;
      inp.dataset.path = path;
      inp.dataset.kind = "locstring";
      inp.addEventListener("input", onGffEdit);
      row.appendChild(key); row.appendChild(ty); row.appendChild(inp);
      wrap.appendChild(row);
    } else if (t === VOID_TYPE) {
      const row = document.createElement("div");
      row.className = "gff-leaf";
      row.innerHTML = `<span class="gff-key">${label}</span><span class="gff-type">void (read-only)</span>`;
      wrap.appendChild(row);
    } else if (SIMPLE_TYPES[t]) {
      const row = document.createElement("div");
      row.className = "gff-leaf";
      const key = document.createElement("span");
      key.className = "gff-key";
      key.textContent = label;
      const ty = document.createElement("span");
      ty.className = "gff-type";
      ty.textContent = SIMPLE_TYPES[t];
      const inp = document.createElement("input");
      inp.value = String(field.value);
      inp.dataset.path = path;
      inp.dataset.kind = "scalar";
      inp.dataset.ftype = String(t);
      inp.addEventListener("input", onGffEdit);
      row.appendChild(key); row.appendChild(ty); row.appendChild(inp);
      wrap.appendChild(row);
    }
  }
  return wrap;
}

function gffNodeAt(path) {
  // Navigates state.current.doc._struct by dotted path with [i] list indexing.
  let node = state.current.doc._struct;
  const parts = path.split(".");
  for (let i = 0; i < parts.length; i++) {
    let p = parts[i];
    const m = p.match(/^([^\[]+)\[(\d+)\]$/);
    if (m) {
      node = node[m[1]].value[+m[2]];
    } else if (i === parts.length - 1) {
      return { parent: node, key: p };
    } else {
      node = node[p].value;
    }
  }
  return { parent: node, key: parts[parts.length - 1] };
}

function onGffEdit(e) {
  const inp = e.target;
  const path = inp.dataset.path;
  const { parent, key } = gffNodeAt(path);
  const field = parent[key];
  if (inp.dataset.kind === "scalar") {
    const t = +inp.dataset.ftype;
    if ([8, 9].includes(t)) field.value = parseFloat(inp.value);
    else if (t === 10 || t === 11) field.value = inp.value;
    else field.value = parseInt(inp.value, 10);
  } else if (inp.dataset.kind === "locstring") {
    if (!field.value.substrings.length) {
      field.value.substrings.push({ id: 0, text: inp.value });
    } else {
      field.value.substrings[0].text = inp.value;
    }
  }
  state.dirty.add(path);
  inp.parentElement.classList.add("dirty");
  $("saveBtn").disabled = false;
  $("saveStatus").textContent = `${state.dirty.size} unsaved field(s)`;
  $("saveStatus").className = "status";
}

// ---------------- Save ----------------

async function save() {
  if (!state.current) return;
  $("saveBtn").disabled = true;
  $("saveStatus").textContent = "saving…";
  try {
    let payload;
    if (state.current.kind === "2da") {
      payload = { twoda: {
        version: state.current.version,
        columns: state.current.columns,
        row_labels: state.current.row_labels,
        rows: state.current.rows,
      }};
    } else {
      payload = { gff: state.current.doc };
    }
    let url;
    if (state.current._archiveResref) {
      const innerParam = (state.current._archiveInner || []).join("|");
      url = `/api/save_archive_entry?install=${state.install}` +
            `&folder=${encodeURIComponent(state.current._archiveFolder)}` +
            `&archive=${encodeURIComponent(state.current._archiveName)}` +
            `&inner=${encodeURIComponent(innerParam)}` +
            `&resref=${encodeURIComponent(state.current._archiveResref)}` +
            `&res_type=${state.current._archiveResType}`;
    } else if (state.current._saveFolder) {
      url = `/api/save_file?install=${state.install}` +
            `&folder=${encodeURIComponent(state.current._saveFolder)}` +
            `&name=${encodeURIComponent(state.current._saveFile)}`;
    } else {
      url = `/api/file?install=${state.install}&name=${encodeURIComponent(state.current.name)}`;
    }
    const res = await api(url, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify(payload),
    });
    state.dirty = new Set();
    $("saveStatus").textContent = "saved · " + (res.rows ? `${res.rows}×${res.columns}` : "ok");
    $("saveStatus").className = "status ok";
    if (state.current.kind === "2da") renderTwoDA(); else renderGFF();
  } catch (e) {
    $("saveStatus").textContent = "save failed: " + e.message;
    $("saveStatus").className = "status err";
    $("saveBtn").disabled = false;
  }
}

// ---------------- Wiring ----------------

$("install").onchange = (e) => {
  state.install = e.target.value;
  state.current = null;
  updateInstallStatus();
  $("gridWrap").innerHTML = '<div class="empty">Pick a file from the sidebar.</div>';
  loadList();
};
$("kind").onchange = (e) => { state.kind = e.target.value; loadList(); };
$("fileFilter").oninput = renderFileList;
$("rowFilter").oninput = () => { if (state.current && state.current.kind === "2da") renderTwoDA(); };
$("reloadBtn").onclick = () => state.current ? openFile(state.current.name) : loadList();
$("saveBtn").onclick = save;
for (const t of document.querySelectorAll(".tab")) {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    state.source = t.dataset.source;
    state.archive = null;
    $("archiveBack").style.display = "none";
    loadList();
  };
}
$("archiveBackBtn").onclick = () => {
  if (state.archive && state.archive.inner && state.archive.inner.length > 0) {
    // Pop one nested level
    state.archive = { ...state.archive, inner: state.archive.inner.slice(0, -1) };
  } else {
    state.source = "saves";
    state.archive = null;
  }
  loadList();
};

loadInstalls().catch(err => {
  document.body.innerHTML = '<div class="empty">Failed to load: ' + err.message + '</div>';
});
</script>
</body>
